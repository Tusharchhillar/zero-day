[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zero-day"
version = "0.1.0"
description = "AI-Based Detection of Cyber Threats in Unidirectional IP Traffic — SIH26145"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "torch>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=12.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
zero-day-api = "zero_day.cli:run_api"
zero-day-replay = "zero_day.cli:run_replay"
zero-day-train = "zero_day.cli:run_train"
zero-day-evaluate = "zero_day.cli:run_evaluate"
zero-day-benchmark = "zero_day.cli:run_benchmark"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_day"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]
